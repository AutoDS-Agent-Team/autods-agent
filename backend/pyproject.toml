[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autods-backend"
version = "0.1.0"
description = "FastAPI foundation for AutoDS-Agent"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "celery>=5.6,<6.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "google-genai>=1.0,<2.0",
  "google-auth>=2.0,<3.0",
  "httpx>=0.28,<1.0",
  "joblib>=1.4,<2.0",
  "numpy>=2.0,<3.0",
  "optuna>=4.0,<5.0",
  "openpyxl>=3.1,<4.0",
  "pandas>=2.2,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.7,<3.0",
  "PyJWT>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "redis>=5.0,<7.0",
  "reportlab>=4.2,<5.0",
  "scikit-learn>=1.6,<2.0",
  "shap>=0.52,<0.53",
  "sqlalchemy>=2.0,<3.0",
  "statsmodels>=0.14,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "xgboost>=2.1,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
